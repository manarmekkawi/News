<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <section id="filter" class="py-5">
        <div class="container">
            <form> 
            <div class="row">
                <div class="col-lg-6">
                    <div class="item">
                         <div class="mb-3">
                            <label for="Category" class="form-label">Category</label>
                            <select class="form-control" id="Category" name="category">
                                <option value="business" selected>Business</option>
                                <option value="health">Health</option>
                                <option value="science">Science</option>
                                <option value="sports">Sports</option>
                                <option value="technology">Technology</option>
                            </select>
                         </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="item">
                        <div class="mb-3">
                        <label for=" Search" class="form-label">Search</label>
                        <input type="text" class="form-control" id="Search">
                        </div>
                    </div>
                </div>
                
            </div>
             <button class="btn btn-success w-100 mt-3"><span>Filter</span></button>
            </form>
        </div>
    </section>

     <section id="Data" class="py-5">
        <div class="container">
            <div class="row"> 
                     <div class="col-lg-4">
                        <div class="item">
                            <div class="card" style="max-width: 320px">
                                <img src="..." class="card-img-top" alt="...">
                                <div class="card-body">
                                    <h4 class="card-title">Card title</h4>
                                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                                    <a href="#" class="btn-solid theme-primary">Go somewhere</a> 
                                </div>
                            </div>
                        </div>
                     </div>
            </div>
            <div id="noResultsMessage" class="text-center text-secondary my-3" style="display: none;">
                <h4>No posts found</h4>
            </div>
            <nav  class="mt-5">
                <ul class="pagination justify-content-center">
                    <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                    <li class="page-item"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
            </nav>
        </div>
    </section>

    
    <script src="js/bootstrap.js"></script>
    <script src="js/jquery.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.2/jquery-ui.min.js"></script>
     <script src="js/function.js"></script>
     <script src="js/index.js"></script>

    
</body>
</html>
